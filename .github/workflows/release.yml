name: Release

# Pushing a version tag (for example v0.2.0) runs the tests and opens a draft release
# with auto-generated notes; the maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Tag matches the package version
        shell: pwsh
        run: |
          $version = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pyproject.toml version $version"
          }

      - name: Ruff lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

  draft-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create a draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --draft --verify-tag --generate-notes
          --title "${{ github.ref_name }}"
