name: Bug report
description: A reader returns an error, wrong data, or misses messages
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy first.** This repository is public. Do not paste real conversations, names,
        account IDs (wxid, Teams IDs), or machine paths. Replace them with fictional values
        such as `wxid_example` or `C:\Users\example`.
  - type: dropdown
    id: reader
    attributes:
      label: Reader
      options:
        - WeChat
        - Teams
        - Backup
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what came back (with personal data replaced).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Chat app version
      description: WeChat or Teams version, if relevant (for example after an app upgrade).
  - type: input
    id: windows-version
    attributes:
      label: Windows version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real conversations, names, account IDs and machine paths from this report.
          required: true
